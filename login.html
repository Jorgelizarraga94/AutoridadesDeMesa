<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingreso de administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="login">
    <form id="form-login" class="formulario" novalidate>
      <h1>Ingreso de administrador</h1>
      <label class="campo">Usuario <input name="usuario" autocomplete="username"></label>
      <label class="campo">Contraseña <input name="clave" type="password" autocomplete="current-password"></label>
      <button class="boton" type="submit">Ingresar</button>
      <div id="mensaje-login" class="mensaje" role="alert"></div>
    </form>
  </main>
  <footer id="footer"></footer>
  <script src="src/datos/repositorioAdministradores.js"></script>
  <script src="src/datos/repositorioSesion.js"></script>
  <script src="src/logica/validaciones.js"></script>
  <script src="src/logica/servicioAutenticacion.js"></script>
  <script src="src/presentacion/componenteNavbar.js"></script>
  <script src="src/presentacion/mensajes.js"></script>
  <script src="src/presentacion/vistaLogin.js"></script>
  <script src="src/presentacion/componenteFooter.js"></script>
  <script>componenteNavbar.mostrar("login"); componenteFooter.mostrar(); vistaLogin.iniciar();</script>
</body>
</html>
